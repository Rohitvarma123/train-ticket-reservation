name: CI/CD Pipeline with SonarQube and Snyk

on:
  push:
    branches:
      - master

jobs:

  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # 1. Checkout Source Code
      - name: Checkout Source
        uses: actions/checkout@v4


      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven


      # 3. Validate
      - name: Validate
        run: mvn validate


      # 4. Compile
      - name: Compile
        run: mvn compile


      # 5. Test
      - name: Test
        run: mvn test


      # 6. Setup Snyk CLI
      - name: Setup Snyk
        uses: snyk/actions/setup@master


      # 7. Snyk Code Security Scan
      - name: Snyk Code Scan
        run: snyk code test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}


      # 8. Package
      - name: Package
        run: mvn package


      # 9. SonarQube Scan
      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:5.7.0.6970:sonar \
            -Dsonar.projectKey=train \
            -Dsonar.projectName=TrainBook \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN"
